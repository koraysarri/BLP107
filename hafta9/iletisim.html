<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programlama Kulübü | İletişim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<div style="background-color: #eeeeee; padding: 10px 20px; border-bottom: 1px solid #cccccc;">
    <a href="../index.html" style="color: #222222; text-decoration: none; font-weight: bold;">
        ← Ana Sayfa
    </a>
</div>
<body class="d-flex flex-column min-vh-100">

  <header class="bg-primary text-white text-center py-5">
    <div class="container">
      <h1 class="display-5 fw-bold">Programlama Kulübü</h1>
      <p class="lead mb-0">Birlikte öğrenir, birlikte üretiriz</p>
    </div>
  </header>

  <div class="container my-4 flex-grow-1">
    <div class="row g-4">
      <aside class="col-12 col-md-3">
        <div class="list-group">
          <a href="index.html" class="list-group-item list-group-item-action">Ana Sayfa</a>
          <a href="hakkimizda.html" class="list-group-item list-group-item-action">Hakkımızda</a>
          <a href="etkinlikler.html" class="list-group-item list-group-item-action">Etkinlikler</a>
          <a href="iletisim.html" class="list-group-item list-group-item-action active" aria-current="true">İletişim</a>
        </div>
      </aside>

      <main class="col-12 col-md-9">
        <h2>İletişim</h2>
        <form>
          <div class="mb-3">
            <label for="ad" class="form-label">Adınız</label>
            <input type="text" class="form-control" id="ad">
          </div>
          <div class="mb-3">
            <label for="eposta" class="form-label">E-posta</label>
            <input type="email" class="form-control" id="eposta">
          </div>
          <div class="mb-3">
            <label for="mesaj" class="form-label">Mesajınız</label>
            <textarea class="form-control" id="mesaj" rows="4"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Gönder</button>
        </form>
      </main>
    </div>
  </div>

  <footer class="bg-dark text-white-50 text-center py-3 mt-auto">
    <small>&copy; 2026 Programlama Kulübü</small>
  </footer>

</body>
</html>
